<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- FAVICONS (из public/) -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- MOBILE VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PRIMARY SEO -->
    <title>Eco Logistic – Vehicle Shipping & Car Transport in the USA</title>
    <meta
      name="description"
      content="Eco Logistic provides fast and reliable vehicle shipping across the USA. Get a free quote for car transport, door-to-door delivery, and insured auto shipping."
    />
    <meta
      name="keywords"
      content="car shipping, vehicle transport, auto transport, car delivery, car hauling, USA, Eco Logistic"
    />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="Eco Logistic" />

    <!-- CANONICAL (потом поменяешь на свой домен) -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eco Logistic – Vehicle Shipping in the USA" />
    <meta
      property="og:description"
      content="Fast and reliable vehicle shipping across the USA. Free quote, insured delivery, and professional support."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eco Logistic – Vehicle Shipping in the USA" />
    <meta
      name="twitter:description"
      content="Fast and reliable vehicle shipping across the USA. Get your free quote today."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- THEME / COLOR SCHEME (учитывая твой dark/light переключатель) -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" />

    <!-- FONTAWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- VITE ENTRY (Vite сам подменит на билд-файлы) -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
