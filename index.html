<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Eco Logistic – Vehicle Shipping & Car Transport in the USA</title>
    <meta
      name="description"
      content="Eco Logistic provides fast and reliable vehicle shipping across the USA. Get a free quote for car transport, door-to-door delivery, and insured auto shipping."
    />

    <!-- (опционально) ключевые слова -->
    <meta
      name="keywords"
      content="car shipping, vehicle transport, auto transport, car delivery, car hauling, USA, Eco Logistic"
    />

    <!-- Canonical URL (поменяешь на свой домен, когда зальёшь на хост) -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph (для красивого превью в соцсетях) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eco Logistic – Vehicle Shipping in the USA" />
    <meta
      property="og:description"
      content="Fast and reliable vehicle shipping across the USA. Free quote, insured delivery, and professional support."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <!-- Путь к картинке для превью. Заменишь на свой файл в /public, например /og-image.jpg -->
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eco Logistic – Vehicle Shipping in the USA" />
    <meta
      name="twitter:description"
      content="Fast and reliable vehicle shipping across the USA. Get your free quote today."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.jpg" />

    <!-- FontAwesome (иконки) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
